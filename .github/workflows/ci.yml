name: CI

on:
  push:
    branches: [ main, initial-develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23.4']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: make test

    - name: Run tests with race detector
      run: go test -race ./...

    - name: Check test coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -1 | awk '{if ($3+0 < 50) exit 1}'

    - name: Run property-based tests
      run: make test-prop

    - name: Build
      run: make build

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted properly:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    # Staticcheck: verify with latest stable release
    - name: Staticcheck
      uses: dominikh/staticcheck-action@v1.3.1
      with:
        version: "2025.1"
        install-go: false

  build-matrix:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.4'

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        VERSION: ${{ github.ref_name }}
      run: |
        mkdir -p dist
        EXT=""
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        fi
        go build -ldflags="-s -w -X main.version=$VERSION" -o "dist/surveiller-$GOOS-$GOARCH$EXT" .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: surveiller-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/

  packaging-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.11'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Install packaging tools
      run: |
        echo "${HOME}/go/bin" >> "$GITHUB_PATH"
        go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1
        nfpm --version
        pwsh --version

    - name: Run US1 packaging smoke test
      run: scripts/packaging/ci/smoke_us1.sh --version v0.0.1-smoke
