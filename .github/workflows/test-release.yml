name: Test Release Build

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version (e.g., v0.0.1-test)'
        required: true
        default: 'v0.0.1-test'

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.11

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: |
        for attempt in 1 2 3; do
          echo "Running make test (attempt ${attempt})..."
          if make test; then
            break
          fi
          if [ "${attempt}" -eq 3 ]; then
            echo "make test failed after 3 attempts"
            exit 1
          fi
          sleep 2
        done
        make test-prop

    - name: Test build for all platforms
      env:
        VERSION: ${{ github.event.inputs.test_version }}
      run: |
        mkdir -p dist
        
        # Set version in build
        LDFLAGS="-s -w -X main.version=${VERSION#v}"
        
        echo "Testing build with LDFLAGS: $LDFLAGS"
        
        # Linux
        echo "Building Linux AMD64..."
        GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/surveiller-linux-amd64 .
        echo "Building Linux ARM64..."
        GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/surveiller-linux-arm64 .
        
        # macOS
        echo "Building macOS AMD64..."
        GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/surveiller-darwin-amd64 .
        echo "Building macOS ARM64..."
        GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/surveiller-darwin-arm64 .
        
        # Windows
        echo "Building Windows AMD64..."
        GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/surveiller-windows-amd64.exe .
        
        echo "All builds completed successfully!"
        ls -la dist/

    - name: Test binary version
      run: |
        echo "Testing Linux binary version..."
        ./dist/surveiller-linux-amd64 -version
        echo "Verifying cross-platform binary artifacts..."
        test -f ./dist/surveiller-linux-arm64
        test -f ./dist/surveiller-darwin-amd64
        test -f ./dist/surveiller-darwin-arm64
        test -f ./dist/surveiller-windows-amd64.exe
        file ./dist/surveiller-*

    - name: Create test checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        echo "Test checksums:"
        cat checksums.txt

    - name: Generate release manifest
      env:
        VERSION: ${{ github.event.inputs.test_version }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        chmod +x scripts/packaging/generate_release_manifest.sh
        chmod +x scripts/packaging/normalize_version.sh
        ./scripts/packaging/generate_release_manifest.sh \
          --version "${VERSION}" \
          --commit-sha "${GITHUB_SHA}" \
          --release-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --repository "${GITHUB_REPOSITORY}" \
          --dist-dir dist \
          --checksums-file dist/checksums.txt \
          --schema packaging/release-manifest.schema.json \
          --output dist/release-manifest.json
        cat dist/release-manifest.json

    - name: Install packaging tools
      run: |
        echo "${HOME}/go/bin" >> "$GITHUB_PATH"
        go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1
        nfpm --version

    - name: Build package artifacts
      run: |
        chmod +x scripts/packaging/build_linux_packages.sh
        chmod +x scripts/packaging/render_homebrew_formula.sh
        chmod +x scripts/packaging/verify_package_artifacts.sh

        ./scripts/packaging/build_linux_packages.sh \
          --manifest dist/release-manifest.json \
          --dist-dir dist \
          --checksums-file dist/checksums.txt

        ./scripts/packaging/render_homebrew_formula.sh \
          --manifest dist/release-manifest.json \
          --dist-dir dist \
          --checksums-file dist/checksums.txt

        pwsh -File ./scripts/packaging/build_choco_package.ps1 \
          -ManifestPath dist/release-manifest.json \
          -DistDir dist \
          -ChecksumsFile dist/checksums.txt

    - name: Assert package artifacts
      run: |
        ls -la dist/packages/linux/*.deb
        ls -la dist/packages/linux/*.rpm
        test -f dist/packages/homebrew/surveiller.rb
        ls -la dist/packages/choco/*.nupkg
        test -f dist/packages/choco/surveiller.nuspec

    - name: Verify package artifact integrity
      run: |
        ./scripts/packaging/verify_package_artifacts.sh \
          --manifest dist/release-manifest.json \
          --dist-dir dist \
          --checksums-file dist/checksums.txt

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-binaries-${{ github.event.inputs.test_version }}
        path: dist/
        retention-days: 1
