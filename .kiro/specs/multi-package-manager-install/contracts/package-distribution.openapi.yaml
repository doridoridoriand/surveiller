openapi: 3.1.0
info:
  title: Surveiller Package Distribution API
  version: 0.1.0
  description: Contract for release packaging and publication automation.
servers:
  - url: https://release-control.example.internal
paths:
  /v1/releases/{version}/packages:
    post:
      summary: Create package build jobs for selected package managers.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageJobsRequest'
      responses:
        '202':
          description: Jobs accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageJobResponse'
  /v1/releases/{version}/packages/{manager}:
    get:
      summary: Get package publication status for one manager.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
        - name: manager
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Manager'
      responses:
        '200':
          description: Manager publication status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationStatus'
  /v1/releases/{version}/repositories/publish:
    post:
      summary: Publish previously built packages to repositories/tap/feed.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '202':
          description: Publish accepted.
  /v1/releases/{version}/install-commands:
    get:
      summary: Fetch install commands for documentation and release notes.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Install commands by manager.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallCommandsResponse'
components:
  schemas:
    Manager:
      type: string
      enum:
        - apt
        - dnf
        - brew
        - choco
    CreatePackageJobsRequest:
      type: object
      required:
        - managers
        - dryRun
      properties:
        managers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Manager'
        managerAliases:
          type: array
          description: Optional aliases from user input, e.g. "choro" -> "choco".
          items:
            type: string
        dryRun:
          type: boolean
    PackageJobResponse:
      type: object
      required:
        - version
        - jobs
      properties:
        version:
          type: string
        jobs:
          type: array
          items:
            type: object
            required:
              - manager
              - state
            properties:
              manager:
                $ref: '#/components/schemas/Manager'
              state:
                type: string
                enum: [queued, building, published, failed]
    PublishRequest:
      type: object
      required:
        - managers
      properties:
        managers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Manager'
    PublicationStatus:
      type: object
      required:
        - manager
        - version
        - state
      properties:
        manager:
          $ref: '#/components/schemas/Manager'
        version:
          type: string
        state:
          type: string
          enum: [queued, building, published, failed, rolled_back]
        publishedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
    InstallCommandsResponse:
      type: object
      required:
        - version
        - commands
      properties:
        version:
          type: string
        commands:
          type: object
          additionalProperties:
            type: string

